name: macOS release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e . 'pyinstaller==6.22.3'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: .venv/bin/python -c 'import os; from manuscript_review import __version__; assert os.environ["RELEASE_TAG"] == "v" + __version__'
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/python build_macos.py
      - run: codesign --verify --deep --strict 'dist/Manuscript Review.app'
      - run: '"dist/Manuscript Review.app/Contents/MacOS/manuscript-review-agent" --version'
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" 'dist/Manuscript Review.zip' --verify-tag --draft --title "Manuscript Review ${RELEASE_TAG#v}" --notes-file docs/RELEASE.md
